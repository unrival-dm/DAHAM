<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAHAM 연결 테스트</title><style>body{font-family:Arial,sans-serif;background:#f8fafc;padding:24px}.box{max-width:520px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.ok{color:#047857}.err{color:#b91c1c}.wait{color:#9a3412}</style></head><body><div class="box"><h2>DAHAM 서버 연결 테스트</h2><div id="state" class="wait">브리지 연결 확인 중…</div><p id="detail"></p></div><script src="../assets/config.js"></script><script src="../assets/bridge-client.js"></script><script>function ready(){state.textContent='브리지 연결됨';state.className='ok';detail.textContent='GitHub ↔ Apps Script bridge 통신 준비 완료';}window.addEventListener('daham-bridge-ready',ready);window.addEventListener('daham-bridge-error',e=>{state.textContent='브리지 연결 실패';state.className='err';detail.textContent=(e.detail&&e.detail.message)||'Apps Script 배포/bridge.html 확인 필요';});window.addEventListener('load',()=>{if(window.DAHAM_BRIDGE&&window.DAHAM_BRIDGE.ready)ready();});</script></body></html>
