<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>도급 출퇴근 스캐너</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#0f172a;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .app{height:100%;display:flex;flex-direction:column;padding:14px;gap:12px}
    .top{text-align:center;flex:none}
    h1{margin:2px 0 4px;font-size:clamp(22px,5vw,34px)}
    .sub{margin:0;color:#94a3b8;font-size:clamp(13px,3vw,17px)}
    #reader{position:relative;flex:1;min-height:0;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.25)}
    #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
    #reader img{display:none!important}
    #status{flex:none;min-height:88px;border-radius:18px;background:#1e293b;display:flex;align-items:center;justify-content:center;text-align:center;padding:13px 18px;font-size:clamp(20px,4.5vw,31px);font-weight:800;line-height:1.25}
    #status.ok{background:#047857}
    #status.bad{background:#b91c1c}
    #status.wait{background:#334155}
    #status.work{background:#a16207}
    #overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.98);display:none;align-items:center;justify-content:center;padding:24px}
    #overlay.show{display:flex}
    .card{max-width:520px;width:100%;background:#fff;color:#0f172a;border-radius:22px;padding:26px;text-align:center}
    .card h2{margin:0 0 10px;font-size:27px}
    .card p{margin:0 0 18px;line-height:1.55;color:#475569;font-size:16px;white-space:pre-line}
    .card button{width:100%;border:0;border-radius:14px;padding:17px;background:#2563eb;color:#fff;font-size:19px;font-weight:800}
    .small{margin-top:13px!important;font-size:13px!important;color:#64748b!important}
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1>도급 출퇴근</h1>
      <p class="sub">작업자 QR을 카메라에 보여주세요</p>
    </div>
    <div id="reader"></div>
    <div id="status" class="wait">카메라 준비 중...</div>
  </div>

  <div id="overlay">
    <div class="card">
      <h2 id="overlayTitle">카메라 권한이 필요합니다</h2>
      <p id="overlayText">QR을 읽기 위해 카메라 사용 권한이 필요합니다.</p>
      <button id="cameraBtn" type="button">카메라 허용하고 시작</button>
      <p class="small">최초 1회만 허용하면 이후에는 페이지를 열어둔 채 QR만 보여주면 됩니다.</p>
    </div>
  </div>

<script>
(() => {
  const API_URL = 'https://script.google.com/macros/s/AKfycbxCzuxN0zgp0C5lrJWlkQXuYvielnBVx251ZcHjtnsGsKd2acNIVI3xJe9rgV9LBtBG/exec';
  const statusEl = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const cameraBtn = document.getElementById('cameraBtn');

  let scanner = null;
  let running = false;
  let starting = false;
  let processing = false;
  let lastQr = '';
  let lastQrAt = 0;
  let wakeLock = null;

  let scannerId = localStorage.getItem('contractScannerId');
  if (!scannerId) {
    scannerId = 'TABLET-' + Math.random().toString(36).slice(2,10).toUpperCase();
    localStorage.setItem('contractScannerId', scannerId);
  }

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = type || 'wait';
  }

  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function apiConfigured() {
    return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(API_URL);
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (_) {}
  }

  function callScanApi(token) {
    return new Promise((resolve, reject) => {
      if (!apiConfigured()) {
        reject(new Error('config.js에 Apps Script 웹앱 주소가 설정되지 않았습니다.'));
        return;
      }

      const callback = '__contractScanCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      const script = document.createElement('script');
      let finished = false;

      const cleanup = () => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[callback]; } catch (_) { window[callback] = undefined; }
        script.remove();
      };

      window[callback] = data => {
        cleanup();
        resolve(data);
      };

      const sep = API_URL.includes('?') ? '&' : '?';
      script.src = API_URL + sep
        + 'api=scan'
        + '&token=' + encodeURIComponent(token)
        + '&scanner=' + encodeURIComponent(scannerId)
        + '&callback=' + encodeURIComponent(callback)
        + '&_=' + Date.now();
      script.async = true;
      script.onerror = () => {
        cleanup();
        reject(new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.'));
      };

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('서버 응답 시간이 초과되었습니다.'));
      }, 10000);

      document.head.appendChild(script);
    });
  }

  async function onDecoded(text) {
    const now = Date.now();
    text = String(text || '').trim();
    if (!text || processing) return;
    if (text === lastQr && now - lastQrAt < 3500) return;

    processing = true;
    lastQr = text;
    lastQrAt = now;
    setStatus('처리 중...', 'work');

    try {
      const r = await callScanApi(text);
      if (r && r.ok) {
        const typeText = r.type === 'IN' ? '출근' : '퇴근';
        setStatus(`${r.name} · ${r.time} · ${typeText} 완료`, 'ok');
      } else {
        setStatus((r && r.message) || '처리할 수 없습니다.', 'bad');
      }
    } catch (e) {
      setStatus(e.message || '통신 오류', 'bad');
    }

    setTimeout(() => {
      processing = false;
      setStatus('스캔 대기 중', 'wait');
    }, 1800);
  }

  function onScanFailure(_) {}

  let startPromise = null;

  async function resetScanner_() {
    const old = scanner;
    scanner = null;
    running = false;
    if (!old) return;
    try {
      const state = typeof old.getState === 'function' ? old.getState() : null;
      if (state === 2) await old.stop();
    } catch (_) {}
    try { old.clear(); } catch (_) {}
  }

  function cameraErrorText_(e) {
    if (!e) return '알 수 없는 카메라 오류입니다.';
    return e.message || String(e);
  }

  async function startCamera() {
    if (running) return true;
    if (startPromise) return startPromise;

    startPromise = (async () => {
      starting = true;
      setStatus('카메라 준비 중...', 'wait');

      if (!apiConfigured()) {
        showOverlay('서버 주소 설정 필요', 'Apps Script 웹앱 /exec 주소를 확인해주세요.');
        setStatus('서버 주소를 확인해주세요.', 'bad');
        return false;
      }

      if (!window.isSecureContext) {
        showOverlay('HTTPS가 필요합니다', '카메라는 HTTPS 페이지에서만 사용할 수 있습니다.');
        setStatus('HTTPS 접속이 필요합니다.', 'bad');
        return false;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showOverlay('카메라를 사용할 수 없습니다', '이 브라우저는 카메라 접근을 지원하지 않습니다. 최신 Chrome 또는 Safari를 사용해주세요.');
        setStatus('카메라를 사용할 수 없습니다.', 'bad');
        return false;
      }

      try {
        await resetScanner_();
        scanner = new Html5Qrcode('reader', {verbose:false});
        await scanner.start(
          {facingMode:{ideal:'environment'}},
          {
            fps:12,
            qrbox:(w,h) => {
              const size = Math.floor(Math.min(w,h) * 0.72);
              return {width:size,height:size};
            },
            aspectRatio:1.333334,
            disableFlip:false
          },
          onDecoded,
          onScanFailure
        );
        running = true;
        hideOverlay();
        setStatus('스캔 대기 중', 'wait');
        keepAwake();
        return true;
      } catch (e) {
        await resetScanner_();
        const msg = cameraErrorText_(e);
        if (/permission|denied|notallowed/i.test(msg) || e?.name === 'NotAllowedError') {
          showOverlay('카메라 권한이 필요합니다', '아래 버튼을 한 번 눌러 카메라 사용을 허용해주세요.\n이미 차단했다면 브라우저의 사이트 설정에서 카메라를 허용해야 합니다.');
        } else {
          showOverlay('카메라를 시작할 수 없습니다', msg);
        }
        setStatus('카메라를 확인해주세요.', 'bad');
        return false;
      } finally {
        starting = false;
      }
    })();

    try {
      return await startPromise;
    } finally {
      startPromise = null;
    }
  }

  async function requestPermission() {
    if (cameraBtn.disabled || running || startPromise) return;
    cameraBtn.disabled = true;
    cameraBtn.textContent = '카메라 연결 중...';
    try {
      await startCamera();
    } finally {
      cameraBtn.disabled = false;
      cameraBtn.textContent = '카메라 허용하고 시작';
    }
  }

  cameraBtn.addEventListener('click', requestPermission);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) keepAwake();
  });

  // 페이지 최초 진입 시 단 한 번만 자동 시작을 시도합니다.
  // 실패했을 때만 오버레이 버튼을 통해 다시 시도합니다.
  window.addEventListener('load', () => {
    setTimeout(() => { startCamera(); }, 350);
  }, {once:true});
})();
</script>
</body>
</html>
