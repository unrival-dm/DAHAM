<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>출/퇴근 인증</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f1f5f9;z-index:2;font-family:Arial,'Noto Sans KR',sans-serif;color:#475569}
.spin{width:28px;height:28px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="loading">
  <div style="text-align:center">
    <div class="spin"></div>
    <div>출/퇴근 인증 불러오는 중…</div>
  </div>
</div>

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbxCzuxN0zgp0C5lrJWlkQXuYvielnBVx251ZcHjtnsGsKd2acNIVI3xJe9rgV9LBtBG/exec?page=worker"
  title="출/퇴근 인증"
  allow="clipboard-read; clipboard-write"
></iframe>

<script>
const app=document.getElementById('app');
const loading=document.getElementById('loading');
app.addEventListener('load',()=>{
  loading.style.display='none';
});
</script>
</body>
</html>
