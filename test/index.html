<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAHAM 서버 연결 테스트</title>
<style>
body{font-family:Arial,sans-serif;padding:24px;max-width:560px;margin:auto;background:#f8fafc}
.box{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.wait{color:#9a3412}.ok{color:#047857}.err{color:#b91c1c}
small{display:block;margin-top:8px;color:#64748b}
</style>
</head>
<body>
<div class="box">
<h2>DAHAM 서버 연결 테스트</h2>
<div id="state" class="wait">POST API 연결 확인 중…</div>
<small id="detail">Apps Script에 ping 요청을 보내고 있습니다.</small>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/bridge-client.js"></script>
<script>
window.addEventListener('daham-bridge-ready',e=>{
  state.textContent='서버 연결 성공';
  state.className='ok';
  detail.textContent='전송방식: POST API · v18';
});
window.addEventListener('daham-bridge-error',e=>{
  state.textContent='서버 연결 실패';
  state.className='err';
  detail.textContent=(e.detail&&e.detail.message)||'연결할 수 없습니다.';
});
window.addEventListener('load',()=>{
  if(window.DAHAM_BRIDGE&&window.DAHAM_BRIDGE.ready){
    state.textContent='서버 연결 성공';
    state.className='ok';
    detail.textContent='전송방식: POST API · v18';
  }
});
</script>
</body>
</html>
